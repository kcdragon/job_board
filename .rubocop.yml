AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "test/dummy/bin/**/*"
    - "test/dummy/db/schema.rb"
    - "test/dummy/config/**/*"
    - "vendor/**/*"

# Keep the codebase's double-quoted strings (RuboCop defaults to single quotes).
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Subjective size/complexity limits and the require-every-class-documented cop are more
# noise than signal for this engine; leave them off.
Metrics:
  Enabled: false
Style/Documentation:
  Enabled: false

# House style, pinned explicitly so a future RuboCop default change can't move it silently.
# (Each currently matches RuboCop's own default.)

# Methods after `private` sit at the same indentation as the rest — no extra indent.
Layout/IndentationConsistency:
  EnforcedStyle: normal

# Array literals use no inner spaces.
Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: no_space

# A blank line both before and after `private`.
Layout/EmptyLinesAroundAccessModifier:
  EnforcedStyle: around
